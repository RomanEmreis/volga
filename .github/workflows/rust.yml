name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # A push to main that GitHub fails to deliver leaves main untested; this re-runs it by hand
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A change to documentation alone - Markdown, the license, issue templates - gives the
  # compiler nothing new to check, so the build, lint and test jobs are skipped for it.
  #
  # This cannot be `paths-ignore` on the trigger: `format_check`, `clippy_check`,
  # `doc_check`, `audit`, `build`, `test` and `coverage` are required checks, and a workflow
  # that never starts leaves them waiting forever, which blocks the pull request. A job
  # skipped by its `if` reports as passed instead.
  #
  # It fails open. Only a diff that was read, and names documentation alone, skips anything;
  # an event it does not know, a diff it could not read, or this job failing outright runs
  # everything. That is why the jobs it gates test for `!= 'false'` rather than `== 'true'`,
  # and why they start from `!cancelled()`: without a status function of its own, an `if`
  # runs only when every job it needs succeeded, this one included - so it has to name
  # `format_check`'s result itself.
  #
  # Only the jobs with nothing upstream but `format_check` are gated; `build`, `test`,
  # `cross_platform` and `coverage` are skipped with them. `format_check` and `audit` always
  # run: the path check reads every file name, documentation included, and an advisory can
  # be published against a `Cargo.lock` nobody changed.
  #
  # `fuzz.yml` skips documentation-only pull requests too, by the same list.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out the merge commit GitHub tests, and its first parent
          # is the base branch as it stands - so the two commits are all the diff needs
          fetch-depth: 2
      - name: Tell code changes from documentation ones
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # Keep in step with `paths-ignore` in fuzz.yml
          DOCS_ONLY: '^(.*\.md|LICENSE|\.github/CODEOWNERS|\.github/ISSUE_TEMPLATE/.*)$'
        run: |
          set -uo pipefail

          base=""
          case "$EVENT" in
            pull_request)
              base="HEAD^1"
              ;;
            push)
              # All zeros for a branch that did not exist before the push
              if [[ ! "$BEFORE" =~ ^0*$ ]] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac

          code=true
          # `--no-renames` lists both sides of a rename, so moving a source file under
          # `docs/` still counts as a code change
          if [ -n "$base" ] && files="$(git diff --no-renames --name-only "$base" HEAD)"; then
            echo "Changed files:"
            echo "$files"
            # An empty diff leaves one empty line, which is not documentation either
            if ! grep -qvE "$DOCS_ONLY" <<< "$files"; then
              code=false
              echo "::notice::Documentation changed alone; the build, lint and test jobs are skipped."
            fi
          else
            echo "No diff to read for a '$EVENT' event; running everything."
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"

  format_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Windows cannot hold every name a POSIX filesystem can, and `git checkout` there
      # refuses the whole tree over one of them - so a single bad name makes the repository
      # unclonable on Windows, and says so only on Windows, as a bare "invalid path" buried
      # in the checkout step. A fuzz corpus seed named `nul` did exactly that. Checked here
      # because it costs seconds on Linux and answers in the words of the actual problem.
      - name: Check that every path can be checked out on Windows
        run: |
          bad=$(
            {
              git ls-files | grep -Ei '(^|/)(con|prn|aux|nul|com[0-9]|lpt[0-9]|clock\$)(\.[^/]*)?$' || true
              git ls-files | grep -E '[<>:"|?*]' || true
              git ls-files | grep -E '[ .](/|$)' || true
              git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d || true
            } | sort -u
          )
          if [ -n "$bad" ]; then
            echo "::error::These paths cannot be checked out on Windows - a reserved device name, a character the filesystem forbids, a segment ending in a dot or a space, or two paths differing only in case:"
            echo "$bad"
            exit 1
          fi
        
  clippy_check:
    runs-on: ubuntu-latest
    needs: [format_check, changes]
    if: ${{ !cancelled() && needs.format_check.result == 'success' && needs.changes.outputs.code != 'false' }}

    steps:
      - uses: actions/checkout@v4
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # `--all-features` turns on `test`, so every integration test compiles and every
      # fixture is used. `full` leaves `test` off while keeping the features those
      # fixtures are written against, which is the shape that let #238 through.
      - name: Run Clippy on the `full` feature set
        run: cargo clippy --all-targets --no-default-features --features full --locked -- -D warnings

  transport_guard_check:
    runs-on: ubuntu-latest
    needs: [format_check, changes]
    if: ${{ !cancelled() && needs.format_check.result == 'success' && needs.changes.outputs.code != 'false' }}

    # `volga` and `volga-oauth-client` each refuse to build without an HTTP transport, and
    # say so through `compile_error!`. A `trybuild` case cannot reach either: it is built
    # against the feature set the outer test run resolved, so there is no way to switch a
    # feature off for one case. Checked here instead. A missing transport cascades into
    # dozens of unresolved-import errors either way, so the build failing proves nothing on
    # its own - what this asserts is that our own line is among them, and therefore the
    # first thing the reader sees.
    steps:
      - uses: actions/checkout@v4
      - name: Check that a missing HTTP transport is refused, and says why
        run: |
          check() {
            # The cascade is only worth reading when the check itself is unhappy
            if cargo check --locked -p "$1" --no-default-features > "$RUNNER_TEMP/$1.log" 2>&1; then
              echo "::error::$1 built with no HTTP transport; the compile_error! guard is gone"
              exit 1
            fi
            grep -qF "$2" "$RUNNER_TEMP/$1.log" || {
              echo "::error::$1 failed without the transport guard's message: $2"
              cat "$RUNNER_TEMP/$1.log"
              exit 1
            }
            echo "$1: refused, as expected"
          }
          check volga \
            "volga requires an HTTP transport: enable at least one of the \`http1\` or \`http2\` features"
          check volga-oauth-client \
            "volga-oauth-client requires at least one of the \`http1\` or \`http2\` features to be enabled"

  msrv_check:
    runs-on: ubuntu-latest
    needs: [format_check, changes]
    if: ${{ !cancelled() && needs.format_check.result == 'success' && needs.changes.outputs.code != 'false' }}

    # Every other job runs on the runner's default stable toolchain, so the MSRV
    # advertised by `rust-version` in the workspace manifest (and by the README
    # badge) is otherwise never exercised. `--all-targets` pulls in dev-dependencies,
    # which is where an MSRV regression is most likely to sneak in.
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check the published crates on MSRV
        run: cargo check --locked --all-features --all-targets

  workspace_check:
    runs-on: ubuntu-latest
    needs: [format_check, changes]
    if: ${{ !cancelled() && needs.format_check.result == 'success' && needs.changes.outputs.code != 'false' }}

    # `default-members` excludes `examples/*`, so no other job ever compiles them
    # and a dependency bump can leave an example behind without failing CI.
    # `--workspace` overrides `default-members` and covers every member.
    steps:
      - uses: actions/checkout@v4
      - name: Check the entire workspace, examples included
        run: cargo check --locked --workspace --all-features --all-targets

  audit:
    runs-on: ubuntu-latest
    needs: format_check

    # audit-check publishes results via the Checks API; without `checks: write`
    # it fails hard on push and silently passes on pull_request.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  doc_check:
    runs-on: ubuntu-latest
    needs: [format_check, changes]
    if: ${{ !cancelled() && needs.format_check.result == 'success' && needs.changes.outputs.code != 'false' }}

    steps:
      - uses: actions/checkout@v4
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      # With every feature on, every intra-doc link resolves. A link to an item behind a
      # feature breaks only where that feature is off, as it is for a plain `cargo doc`
      - name: Check documentation with the default features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  build:
    environment: CICD
    runs-on: ubuntu-latest
    needs: [clippy_check, doc_check]

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --locked
        
  test:
    environment: CICD
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --locked
    - name: Run tests - Full
      run: cargo test --locked --all-features
    - name: Run tests - http1
      run: cargo test --locked --features http1
    - name: Run tests - http2
      run: cargo test --locked --features http2
    - name: Run tests - http1 with test utilities
      # The two steps above compile the `#[cfg(feature = "test")]` suites away, and
      # `--all-features` turns http2 on, which sends the WebSocket test helper down
      # its HTTP/2 path - so without this combination the HTTP/1 upgrade is never
      # exercised anywhere in the matrix.
      run: cargo test --locked --features "http1,ws,test"

  cross_platform:
    needs: build

    strategy:
      # A Windows failure and a macOS failure are different findings, and the first one to
      # go red should not hide the other.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # Every other job runs on Linux, so the platform-specific arms are otherwise never
    # compiled - never mind linted or run: the shutdown signal set in `app.rs`
    # (`ctrl_break` / `ctrl_close` / `ctrl_shutdown` against `SIGTERM`), the default bind
    # address in `connection.rs`, the default certificate names in `volga-dev-cert`, and the
    # discriminators the static file `ETag` cache validates an entry against. Some of those
    # carry `#[cfg(target_os = "windows")]` tests that have never been run at all. Clippy
    # runs here for the same reason the tests do: a lint inside an arm Linux does not compile
    # is a lint nothing in CI has ever seen.
    env:
      # These cases assert the text this crate's own derive emits, which does not vary by
      # platform, and each one drives a nested `cargo build`. There is nothing in them for
      # another OS to find, and minutes to spend not finding it.
      SKIP_UI_TESTS: 1

      # `aws-lc-sys` assembles with NASM on Windows and the runner image is not guaranteed
      # to carry one. Its prebuilt objects need no assembler, and so no extra action in this
      # workflow; where NASM is present it is used instead and this changes nothing. Ignored
      # on macOS.
      AWS_LC_SYS_PREBUILT_NASM: 1

    steps:
      - uses: actions/checkout@v4
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests - Full
        run: cargo test --locked --all-features

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Code coverage check
        env:
          # The `trybuild` cases spend minutes in a nested cargo build and cover nothing
          # measurable; under instrumentation they outlive tarpaulin's per-test timeout
          SKIP_UI_TESTS: 1
        run: |
          cargo tarpaulin --locked --all-features --workspace --config coverage.toml --fail-under 80
