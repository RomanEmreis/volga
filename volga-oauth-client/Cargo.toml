[package]
name = "volga-oauth-client"
version.workspace = true
readme = "README.md"
description = "OAuth 2.1/OIDC client for Volga Web Framework"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["volga", "oauth", "oidc", "client", "discovery"]

[dependencies]
aws-lc-rs = "1.18.1"
base64 = { workspace = true }
bytes = { workspace = true }
form_urlencoded = "1.2.2"
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["tls12", "webpki-tokio", "aws-lc-rs"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "tokio"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
volga-oauth-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
volga = { path = "../volga", features = ["http1", "oauth"] }

[features]
# Default HTTP/1 only client
default = ["http1"]
http1 = ["hyper/http1", "hyper-util/http1", "hyper-rustls/http1"]
http2 = ["hyper/http2", "hyper-util/http2", "hyper-rustls/http2"]
# `private_key_jwt` client authentication (RFC 7523 Section 2.2); pulls in a
# JWS signing backend, which the other client authentication methods do not need
private-key-jwt = ["dep:jsonwebtoken"]
# DPoP sender-constrained tokens (RFC 9449); shares the JWS signing backend
dpop = ["dep:jsonwebtoken"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
