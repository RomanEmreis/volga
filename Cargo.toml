[workspace]
members = ["volga", "volga-*", "examples/*"]
default-members = ["volga", "volga-*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.10.0"
license = "MIT"
edition = "2024"
rust-version = "1.90.0"
authors = ["Roman Emreis <me@romanemreis.com>"]
repository = "https://github.com/RomanEmreis/volga"
documentation = "https://docs.rs/volga"
homepage = "https://romanemreis.github.io/volga-docs"
categories = [
    "web-programming::http-server",
    "web-programming::websocket",
    "network-programming",
    "asynchronous",
]

[workspace.dependencies]
volga-dev-cert    = { path = "volga-dev-cert",    version = "0.10.0" }
volga-di          = { path = "volga-di",          version = "0.10.0" }
volga-macros      = { path = "volga-macros",      version = "0.10.0" }
volga-oauth-client = { path = "volga-oauth-client", version = "0.10.0", default-features = false }
volga-oauth-core  = { path = "volga-oauth-core",  version = "0.10.0" }
volga-open-api    = { path = "volga-open-api",    version = "0.10.0" }
volga-rate-limiter = { path = "volga-rate-limiter", version = "0.10.0" }

# External dependencies shared by more than one crate in the workspace.
# Versions only: features stay with each member, so inheriting one of these
# never widens what a published crate declares.
base64             = "0.23.1"
bytes              = "1.12.1"
http               = "1.5.0"
http-body-util     = "0.1.5"
hyper              = "1.11.1"
hyper-util         = "0.1.20"
jsonwebtoken       = "11.0.0"
mime               = "0.3.17"
reqwest            = "0.13.4"
serde              = "1.0.229"
serde_json         = "1.0.151"
serde_urlencoded   = "0.7.1"
tempfile           = "3.27.0"
tokio              = "1.53.1"
# volga wants the macros and the `Value` impls left out; an example that needs
# them asks for them itself
tracing            = { version = "0.1.44", default-features = false }
tracing-subscriber = "0.3.23"
uuid               = "1.26.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
