[package]
name = "volga"
version.workspace = true
readme = "../README.md"
description = "Easy & Fast Web Framework for Rust"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["async", "server", "http", "web", "framework"]

[dependencies]
# required
async-stream = "0.3.6"
bytes = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http-body-util = { workspace = true }
itoa = "1.0.18"
memchr = "2.8.3"
mime = { workspace = true }
mime_guess = "2.0.5"
pin-project-lite = "0.2.17"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.19"
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
smallvec = "1.15.1"

# optional
arc-swap = { version = "1.9.2", optional = true }
toml = { version = "1.1.2",   optional = true }
async-compression = { version = "0.4.44", features = ["tokio"], optional = true }
base64 = { workspace = true, optional = true }
cookie = { version = "0.18.2", features = ["percent-encode"], optional = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"], optional = true }
httpdate = { version = "1.0.3", optional = true }
hyper = { workspace = true, features = ["server"], optional = true }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "service", "tokio"], optional = true }
multer = { version = "3.1.0", optional = true }
rand = { version = "0.10.2", optional = true }
reqwest = { workspace = true, optional = true }
sha1 = { version = "0.11.0", optional = true }
subtle = { version = "2.6.1", default-features = false, optional = true }
tempfile = { workspace = true, optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12", "aws-lc-rs"], optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true }
tracing = { workspace = true, optional = true }
twox-hash = { version = "2.1.4", optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }

# volga
volga-dev-cert     = { workspace = true, optional = true }
volga-di           = { workspace = true, optional = true }
volga-macros       = { workspace = true, optional = true }
volga-oauth-client = { workspace = true, optional = true, default-features = false }
volga-oauth-core   = { workspace = true, optional = true }
volga-open-api     = { workspace = true, optional = true }
volga-rate-limiter = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
hyper = { workspace = true, features = ["client"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = { workspace = true }
trybuild = "1.0.120"

[features]
# Default HTTP/1 only server
default = ["http1"]
# HTTP/1 and HTTP/2 server
full = [
    "http1",
    "http2",
    "auth",
    "config",
    "middleware",
    "di",
    "oauth-client",
    "tls",
    "cookie-full",
    "tracing",
    "multipart",
    "openapi",
    "problem-details",
    "rate-limiting",
    "static-files",
    "validation-derive",
    "compression-full",
    "decompression-full",
    "ws"
]

config = ["dep:arc-swap", "dep:toml", "serde/derive"]

http1 = ["dep:hyper", "hyper?/http1", "dep:hyper-util", "hyper-util?/http1", "dep:httpdate", "volga-oauth-client?/http1"]
http2 = ["dep:hyper", "hyper?/http2", "dep:hyper-util", "hyper-util?/http2", "dep:httpdate", "volga-oauth-client?/http2"]

auth = ["basic-auth", "jwt-auth"]
auth-full = ["auth", "jwt-derive"]
basic-auth = ["dep:base64", "dep:subtle", "middleware"]
jwt-auth-full = ["jwt-auth", "jwt-derive"]
jwt-auth = ["dep:jsonwebtoken", "middleware", "oauth"]
jwt-derive = ["dep:volga-macros", "volga-macros?/jwt-auth-derive"]
validation-derive = ["dep:volga-macros", "volga-macros?/validation-derive"]
oauth = ["dep:volga-oauth-core", "serde/derive"]
oauth-client = ["jwt-auth", "dep:volga-oauth-client"]

dev-cert = ["dep:volga-dev-cert"]
di = ["dep:volga-di"]
macros = ["dep:volga-macros"]
middleware = []
multipart = ["dep:multer", "dep:rand"]
openapi = ["dep:sha1", "dep:volga-open-api"]
problem-details = ["serde/derive", "volga-open-api?/problem-details"]
rate-limiting = ["dep:twox-hash", "dep:volga-rate-limiter", "middleware"]
static-files = ["dep:sha1"]
tls = ["dep:tokio-rustls", "tokio-rustls?/tls12", "tokio-rustls?/aws-lc-rs"]
tracing = ["dep:tracing"]
ws = ["dep:sha1", "dep:base64", "dep:tokio-tungstenite"]

cookie-full = ["cookie", "cookie-secure"]
cookie = ["dep:cookie"]
cookie-secure = ["private-cookie", "signed-cookie"]
private-cookie = ["di", "dep:cookie", "cookie?/private"]
signed-cookie = ["di", "dep:cookie", "cookie?/signed"]

compression-full = ["compression-brotli", "compression-gzip", "compression-zstd"]
compression-brotli = ["middleware", "dep:async-compression", "async-compression?/brotli"]
compression-gzip = ["middleware", "dep:async-compression", "async-compression?/zlib", "async-compression?/gzip"]
compression-zstd = ["middleware", "dep:async-compression", "async-compression?/zstd"]

decompression-full = ["decompression-brotli", "decompression-gzip", "decompression-zstd"]
decompression-brotli = ["middleware", "dep:async-compression", "async-compression?/brotli"]
decompression-gzip = ["middleware", "dep:async-compression", "async-compression?/zlib", "async-compression?/gzip"]
decompression-zstd = ["middleware", "dep:async-compression", "async-compression?/zstd"]

__fuzzing = []

test = [
    "dep:uuid",
    "dep:tempfile",
    "dep:reqwest", 
    "reqwest?/blocking", 
    "reqwest?/multipart", 
    "reqwest?/stream", 
    "reqwest?/json", 
    "reqwest?/http2", 
    "reqwest?/brotli", 
    "reqwest?/deflate", 
    "reqwest?/gzip", 
    "reqwest?/zstd", 
    "reqwest?/rustls-no-provider"
]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]
workspace = true

[[bench]]
name = "server"
harness = false

[[bench]]
name = "di"
harness = false
required-features = ["di"]

[[bench]]
name = "mw"
harness = false
required-features = ["middleware"]

[[bench]]
name = "auth"
harness = false
required-features = ["jwt-auth","middleware"]
